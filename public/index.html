<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f5b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>QFC Map</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div class="eyebrow">1401 Broadway, Seattle</div>
    <h1>QFC<br>Harvard Market</h1>
    <div class="stars">★ ★ ★</div>
  </header>
  <div id="banner"></div>
  <div class="label">Shopping list</div>
  <p class="sub">Separate items with commas or new lines.</p>
  <textarea id="input" placeholder="milk, 2 avocados&#10;tortilla chips&#10;paper towels"></textarea>
  <div class="row"><button id="go">Find items</button><button id="clear" class="ghost">Clear</button></div>
  <div id="status" class="sub"></div>
  <form id="access" class="row" hidden>
    <input id="code" type="password" autocomplete="current-password" placeholder="Access code" aria-label="Access code">
    <button type="submit">Save</button>
  </form>
  <svg id="map" class="map" viewBox="0 0 100 100" hidden></svg>
  <div id="groups"></div>
  <footer><div class="stars">★ ★ ★</div></footer>
</main>
<script src="app.js" type="module"></script>
</body>
</html>
